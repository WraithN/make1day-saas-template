  <g transform="rotate(-4 32 32)">
    <rect x="8" y="23" width="48" height="18" rx="4" fill="#ffd93d"/>
    <text x="32" y="38" text-anchor="middle"
          font-family="ui-rounded, 'Segoe UI', system-ui, sans-serif"
          font-size="19" font-weight="900" letter-spacing="-1"
          fill="#111111">1day</text>
  </g>
  <path d="M15 50 Q 32 56 49 50" fill="none" stroke="#c9503a" stroke-width="4" stroke-linecap="round"/>
